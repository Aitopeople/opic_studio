services:
  studio:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.local
    environment:
      NODE_ENV: production
      APP_MODE: service
      DATA_DIR: /app/.data
    volumes:
      - studio-data:/app/.data
    init: true
volumes:
  studio-data:
